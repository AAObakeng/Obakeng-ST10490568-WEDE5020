    <h2>SEND US A MESSAGE</h2>

    <p>
        Have a question, suggestion or feedback about the archive?
        Complete the form below.
    </p>

    <form id="contactForm" action="#" method="post" novalidate>

        <label for="contactName">Full Name:</label><br>
        <input type="text" id="contactName" required minlength="3">
        <p id="contactNameError" class="form-error"></p>

        <label for="contactEmail">Email Address:</label><br>
        <input type="email" id="contactEmail" required>
        <p id="contactEmailError" class="form-error"></p>

        <label for="messageType">Message Type:</label><br>

        <select id="messageType" required>
            <option value="">Select message type</option>
            <option value="General question">General question</option>
            <option value="Feedback">Feedback</option>
            <option value="Website issue">Website issue</option>
            <option value="Other">Other</option>
        </select>

        <p id="messageTypeError" class="form-error"></p>

        <label for="contactMessage">Full Message:</label><br>
        <textarea id="contactMessage" rows="6" required minlength="10"></textarea>
        <p id="contactMessageError" class="form-error"></p>

        <button type="submit">SEND MESSAGE</button>

    </form>

</center>
