    <h2>SUBMIT AN ENQUIRY</h2>

    <p>
        Use this form to ask questions about the archive,
        collaborations, sponsorship or volunteering.
    </p>

    <form id="enquiryForm" action="#" method="post" novalidate>

        <label for="enquiryName">Full Name:</label><br>
        <input type="text" id="enquiryName" required minlength="3">
        <p id="enquiryNameError" class="form-error"></p>

        <label for="enquiryEmail">Email Address:</label><br>
        <input type="email" id="enquiryEmail" required>
        <p id="enquiryEmailError" class="form-error"></p>

        <label for="enquiryType">Enquiry Type:</label><br>

        <select id="enquiryType" required>
            <option value="">Select an enquiry type</option>
            <option value="Archive information">Archive information</option>
            <option value="Collaboration">Collaboration</option>
            <option value="Sponsorship">Sponsorship</option>
            <option value="Volunteering">Volunteering</option>
            <option value="Other">Other</option>
        </select>

        <p id="enquiryTypeError" class="form-error"></p>

        <label for="enquiryMessage">Your Enquiry:</label><br>
        <textarea id="enquiryMessage" rows="6" required minlength="10"></textarea>
        <p id="enquiryMessageError" class="form-error"></p>

        <button type="submit">SUBMIT ENQUIRY</button>

    </form>

    <p id="enquiryResponse" aria-live="polite"></p>

</center>
